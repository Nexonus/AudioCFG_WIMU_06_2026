[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocfg"
version = "0.1.0"
description = "WIMU S15: what classifier-free guidance does to generated audio (scale, null embedding, diversity, copying, judges)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jan Konarski" },
    { name = "Jakub Szewczyk" },
    { name = "Vladyslav Serhieiev" },
]
# Core dependencies: enough for config, metadata, statistics, analysis and tests.
# Heavy model dependencies live in optional groups and are imported lazily.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "soundfile>=0.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gen = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "stable-audio-tools>=0.0.16",
    "diffusers>=0.30",
    "transformers>=4.44",
    "pyloudnorm>=0.1.1",
]
metrics = [
    "torch>=2.2",
    "transformers>=4.44",
    "pyloudnorm>=0.1.1",
    "librosa>=0.10",
    "laion-clap>=1.1.6",
    "msclap>=1.3",
    "openl3>=0.4.2",
    "panns-inference>=0.1.1",
    "hear21passt>=0.0.26",
    "faiss-cpu>=1.8",
    "pyacoustid>=1.3",
]
judge = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "bitsandbytes>=0.43",
]
aesthetics = ["audiobox-aesthetics>=0.0.2"]
app = ["gradio>=4.40"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
audiocfg = "audiocfg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"audiocfg.judge" = ["templates/*.txt", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a GPU and downloaded model weights (skipped by default)",
]
addopts = "-m 'not gpu'"

[tool.ruff]
line-length = 100
target-version = "py310"
