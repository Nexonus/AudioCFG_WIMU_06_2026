# Advantage criterion for the replication (prompts 24-47, seed set B), fixed before any pilot B clip exists.
name: criterion_pilot_B
master_seed: 0

# g of the learned null at which all conditions must hold
guidance: [6, 7, 9]

# non-inferiority margin for CCDS: half the SD over prompts of zero-null CCDS at g = 7 in pilot A
# (music 0.1434 / 2, sfx 0.1204 / 2)
ccds_margin:
  music: 0.07
  sfx: 0.06

n_boot: 2000
level: 0.95
